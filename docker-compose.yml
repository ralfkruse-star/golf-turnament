version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: golf_tournament_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-golf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-golf123}
      POSTGRES_DB: ${POSTGRES_DB:-golf_tournament}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-golf}']
      interval: 10s
      timeout: 5s
      retries: 5

  # Application (for local development)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: golf_tournament_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-golf}:${POSTGRES_PASSWORD:-golf123}@db:5432/${POSTGRES_DB:-golf_tournament}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-change-this-in-production}
    ports:
      - '3000:3000'
    volumes:
      - ./.env:/app/.env:ro

volumes:
  postgres_data:
    driver: local
