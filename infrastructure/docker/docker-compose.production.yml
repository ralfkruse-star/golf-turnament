version: '3.8'

# ============================================================================
# Production Docker Compose Configuration
# ============================================================================
# Complete production-ready setup with:
# - Next.js application
# - PostgreSQL database with replication
# - Redis cache
# - PgBouncer connection pooler
# - Nginx reverse proxy
# - Automated backups
# ============================================================================

services:
  # ==========================================================================
  # Application Service
  # ==========================================================================
  app:
    image: golf-tournament:latest
    container_name: golf-tournament-app
    restart: always
    depends_on:
      - db
      - redis
      - pgbouncer
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://app_user:${DB_APP_PASSWORD}@pgbouncer:6432/golf_tournament?sslmode=disable
      - REDIS_URL=redis://redis:6379
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - BREVO_API_KEY=${BREVO_API_KEY}
      - BREVO_SENDER_EMAIL=${BREVO_SENDER_EMAIL}
      - BREVO_SENDER_NAME=${BREVO_SENDER_NAME}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - VAPID_SUBJECT=${VAPID_SUBJECT}
      - CRON_SECRET=${CRON_SECRET}
      - NEXT_PUBLIC_MAIN_DOMAIN=${NEXT_PUBLIC_MAIN_DOMAIN}
      - SENTRY_DSN=${SENTRY_DSN}
      - NEXT_PUBLIC_SENTRY_DSN=${NEXT_PUBLIC_SENTRY_DSN}
    ports:
      - "3000:3000"
    volumes:
      - app-uploads:/app/public/uploads
    networks:
      - golf-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==========================================================================
  # PostgreSQL Database (Primary)
  # ==========================================================================
  db:
    image: postgres:16-alpine
    container_name: golf-tournament-db
    restart: always
    environment:
      - POSTGRES_DB=golf_tournament
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_POSTGRES_PASSWORD}
      - PGDATA=/var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf
      - ./postgres/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    networks:
      - golf-network
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==========================================================================
  # PgBouncer Connection Pooler
  # ==========================================================================
  pgbouncer:
    image: edoburu/pgbouncer:1.21.0
    container_name: golf-tournament-pgbouncer
    restart: always
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql://postgres:${DB_POSTGRES_PASSWORD}@db:5432/golf_tournament
      - POOL_MODE=transaction
      - MAX_CLIENT_CONN=1000
      - DEFAULT_POOL_SIZE=20
      - MIN_POOL_SIZE=5
      - RESERVE_POOL_SIZE=5
      - MAX_DB_CONNECTIONS=50
    ports:
      - "6432:6432"
    networks:
      - golf-network
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost", "-p", "6432", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # ==========================================================================
  # Redis Cache
  # ==========================================================================
  redis:
    image: redis:7-alpine
    container_name: golf-tournament-redis
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - golf-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # ==========================================================================
  # Nginx Reverse Proxy
  # ==========================================================================
  nginx:
    image: nginx:alpine
    container_name: golf-tournament-nginx
    restart: always
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx-cache:/var/cache/nginx
    networks:
      - golf-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==========================================================================
  # Database Backup Service
  # ==========================================================================
  backup:
    image: postgres:16-alpine
    container_name: golf-tournament-backup
    restart: always
    depends_on:
      - db
    environment:
      - PGHOST=db
      - PGPORT=5432
      - PGUSER=postgres
      - PGPASSWORD=${DB_POSTGRES_PASSWORD}
      - PGDATABASE=golf_tournament
      - BACKUP_DIR=/backups
      - BACKUP_KEEP_DAYS=30
      - S3_BUCKET=${BACKUP_S3_BUCKET}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
    volumes:
      - backup-data:/backups
      - ./backup/backup.sh:/backup.sh
      - ./backup/restore.sh:/restore.sh
    networks:
      - golf-network
    entrypoint: /bin/sh
    command: >
      -c "apk add --no-cache aws-cli &&
          echo '0 2 * * * /backup.sh' | crontab - &&
          crond -f -l 2"
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # ==========================================================================
  # Cron Jobs Service
  # ==========================================================================
  cron:
    image: curlimages/curl:latest
    container_name: golf-tournament-cron
    restart: always
    depends_on:
      - app
    environment:
      - APP_URL=http://app:3000
      - CRON_SECRET=${CRON_SECRET}
    volumes:
      - ./cron/crontab:/etc/crontabs/root
    networks:
      - golf-network
    entrypoint: crond
    command: -f -l 2
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # ==========================================================================
  # Monitoring: Prometheus
  # ==========================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: golf-tournament-prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
    networks:
      - golf-network
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # ==========================================================================
  # Monitoring: Grafana
  # ==========================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: golf-tournament-grafana
    restart: always
    depends_on:
      - prometheus
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    networks:
      - golf-network
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

# ============================================================================
# Networks
# ============================================================================
networks:
  golf-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

# ============================================================================
# Volumes
# ============================================================================
volumes:
  db-data:
    driver: local
  redis-data:
    driver: local
  app-uploads:
    driver: local
  backup-data:
    driver: local
  nginx-cache:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

# ============================================================================
# USAGE INSTRUCTIONS
# ============================================================================
#
# 1. SETUP:
#    - Copy this file to your server
#    - Create .env file with all required variables
#    - Create nginx, postgres, backup, cron, monitoring directories
#    - Build application image: docker build -t golf-tournament:latest .
#
# 2. DEPLOY:
#    docker-compose -f docker-compose.production.yml up -d
#
# 3. MIGRATIONS:
#    docker-compose -f docker-compose.production.yml exec app pnpm prisma migrate deploy
#
# 4. LOGS:
#    docker-compose -f docker-compose.production.yml logs -f app
#
# 5. SCALING:
#    docker-compose -f docker-compose.production.yml up -d --scale app=3
#
# 6. BACKUP:
#    docker-compose -f docker-compose.production.yml exec backup /backup.sh
#
# 7. RESTORE:
#    docker-compose -f docker-compose.production.yml exec backup /restore.sh <backup-file>
#
# 8. MONITORING:
#    - Prometheus: http://localhost:9090
#    - Grafana: http://localhost:3001
#
# 9. STOP:
#    docker-compose -f docker-compose.production.yml down
#
# 10. CLEANUP:
#     docker-compose -f docker-compose.production.yml down -v
#
# ============================================================================
