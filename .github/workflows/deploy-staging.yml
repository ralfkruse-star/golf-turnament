name: Deploy to Staging

on:
  push:
    branches: [develop]
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9'

jobs:
  test-and-build:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linting
        run: pnpm lint:check

      - name: Type check
        run: pnpm type-check

      - name: Run unit tests
        run: pnpm test:coverage

      - name: Generate Prisma Client
        run: pnpm prisma generate

      - name: Build application
        run: pnpm build
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          NEXTAUTH_SECRET: ${{ secrets.STAGING_NEXTAUTH_SECRET }}
          NEXTAUTH_URL: ${{ secrets.STAGING_NEXTAUTH_URL }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: staging-build
          path: |
            .next/
            public/
            package.json
            pnpm-lock.yaml
          retention-days: 7

  deploy-staging:
    name: Deploy to Staging Environment
    runs-on: ubuntu-latest
    needs: test-and-build
    environment:
      name: staging
      url: ${{ secrets.STAGING_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: staging-build

      - name: Deploy to Staging
        run: |
          echo "Deploying to staging environment..."
          # Add your deployment commands here
          # Examples:
          # - Deploy to Vercel: vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }}
          # - Deploy to AWS: aws s3 sync .next s3://staging-bucket
          # - Deploy to Docker registry: docker push registry/app:staging
          echo "Deployment completed!"

      - name: Run database migrations
        run: |
          echo "Running database migrations on staging..."
          # pnpm prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}

  smoke-tests:
    name: Run Smoke Tests
    runs-on: ubuntu-latest
    needs: deploy-staging
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run smoke tests
        run: pnpm test:smoke
        env:
          TEST_URL: ${{ secrets.STAGING_URL }}

      - name: Health check
        run: |
          echo "Running health check on staging..."
          curl -f ${{ secrets.STAGING_URL }}/api/health || exit 1

  notify-deployment:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: [deploy-staging, smoke-tests]
    if: always()
    steps:
      - name: Notify success
        if: needs.deploy-staging.result == 'success' && needs.smoke-tests.result == 'success'
        run: |
          echo "✅ Staging deployment successful!"
          # Add Slack/Discord notification here
          # curl -X POST ${{ secrets.SLACK_WEBHOOK_URL }} \
          #   -H 'Content-Type: application/json' \
          #   -d '{"text":"✅ Staging deployment successful for commit ${{ github.sha }}"}'

      - name: Notify failure
        if: needs.deploy-staging.result == 'failure' || needs.smoke-tests.result == 'failure'
        run: |
          echo "❌ Staging deployment failed!"
          # Add Slack/Discord notification here
          # curl -X POST ${{ secrets.SLACK_WEBHOOK_URL }} \
          #   -H 'Content-Type: application/json' \
          #   -d '{"text":"❌ Staging deployment failed for commit ${{ github.sha }}"}'

  rollback-on-failure:
    name: Rollback on Failure
    runs-on: ubuntu-latest
    needs: [deploy-staging, smoke-tests]
    if: failure()
    steps:
      - name: Rollback deployment
        run: |
          echo "Rolling back staging deployment..."
          # Add rollback commands here
          # vercel rollback --token=${{ secrets.VERCEL_TOKEN }}
