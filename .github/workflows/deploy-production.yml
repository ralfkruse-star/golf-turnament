name: Deploy to Production

on:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9'

jobs:
  validation:
    name: Pre-deployment Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate branch
        run: |
          if [[ "${{ github.ref }}" != "refs/heads/main" ]] && [[ ! "${{ github.ref }}" =~ ^refs/tags/v ]]; then
            echo "Production deployments only allowed from main branch or version tags"
            exit 1
          fi

  test-and-build:
    name: Test & Build
    runs-on: ubuntu-latest
    needs: validation
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run all quality checks
        run: pnpm validate

      - name: Run all tests
        run: pnpm test:all

      - name: Generate Prisma Client
        run: pnpm prisma generate

      - name: Build production bundle
        run: pnpm build
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          NEXTAUTH_SECRET: ${{ secrets.PRODUCTION_NEXTAUTH_SECRET }}
          NEXTAUTH_URL: ${{ secrets.PRODUCTION_NEXTAUTH_URL }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: production-build
          path: |
            .next/
            public/
            package.json
            pnpm-lock.yaml
            prisma/
          retention-days: 30

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: test-and-build
    steps:
      - uses: actions/checkout@v4

      - name: Run security audit
        run: pnpm audit --production --audit-level=high

      - name: Run Snyk security scan
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [test-and-build, security-scan]
    environment:
      name: production
      url: ${{ secrets.PRODUCTION_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: production-build

      - name: Create deployment backup
        run: |
          echo "Creating backup before deployment..."
          # Add backup commands here
          # pg_dump ${{ secrets.PRODUCTION_DATABASE_URL }} > backup-$(date +%Y%m%d-%H%M%S).sql

      - name: Deploy to Production
        run: |
          echo "Deploying to production environment..."
          # Add your production deployment commands here
          # Examples:
          # - Deploy to Vercel: vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }}
          # - Deploy to AWS: aws ecs update-service --cluster prod --service app --force-new-deployment
          # - Deploy to Kubernetes: kubectl apply -f k8s/production/
          echo "Deployment completed!"

      - name: Run database migrations
        run: |
          echo "Running database migrations on production..."
          # pnpm prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}

  smoke-tests:
    name: Production Smoke Tests
    runs-on: ubuntu-latest
    needs: deploy-production
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run smoke tests
        run: pnpm test:smoke
        env:
          TEST_URL: ${{ secrets.PRODUCTION_URL }}

      - name: Health check
        run: |
          echo "Running health check on production..."
          curl -f ${{ secrets.PRODUCTION_URL }}/api/health || exit 1

      - name: Performance check
        run: |
          echo "Checking performance metrics..."
          # Add performance validation
          # lighthouse ${{ secrets.PRODUCTION_URL }} --output json --output-path ./lighthouse-report.json

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: smoke-tests
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release notes
        id: release_notes
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

          # Generate changelog
          git log --pretty=format:"- %s (%h)" $(git describe --tags --abbrev=0 HEAD^)..HEAD > CHANGELOG.md
          echo "Generated changelog for $VERSION"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.release_notes.outputs.VERSION }}
          name: Release ${{ steps.release_notes.outputs.VERSION }}
          body_path: CHANGELOG.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify-stakeholders:
    name: Notify Stakeholders
    runs-on: ubuntu-latest
    needs: [deploy-production, smoke-tests]
    if: always()
    steps:
      - name: Notify success
        if: needs.deploy-production.result == 'success' && needs.smoke-tests.result == 'success'
        run: |
          echo "✅ Production deployment successful!"
          # Add notification commands here
          # Slack:
          # curl -X POST ${{ secrets.SLACK_WEBHOOK_URL }} \
          #   -H 'Content-Type: application/json' \
          #   -d '{
          #     "text":"✅ Production deployment successful!",
          #     "blocks":[{
          #       "type":"section",
          #       "text":{
          #         "type":"mrkdwn",
          #         "text":"*Production Deployment Complete*\n• Commit: `${{ github.sha }}`\n• Author: ${{ github.actor }}\n• URL: ${{ secrets.PRODUCTION_URL }}"
          #       }
          #     }]
          #   }'

          # Email:
          # Send email notification to stakeholders

      - name: Notify failure
        if: needs.deploy-production.result == 'failure' || needs.smoke-tests.result == 'failure'
        run: |
          echo "❌ Production deployment failed!"
          # Add failure notification commands here
          # curl -X POST ${{ secrets.SLACK_WEBHOOK_URL }} \
          #   -H 'Content-Type: application/json' \
          #   -d '{"text":"❌ Production deployment failed! Immediate attention required."}'

  rollback-on-failure:
    name: Emergency Rollback
    runs-on: ubuntu-latest
    needs: [deploy-production, smoke-tests]
    if: failure()
    environment:
      name: production-rollback
    steps:
      - name: Rollback deployment
        run: |
          echo "🚨 Initiating emergency rollback..."
          # Add rollback commands here
          # vercel rollback --token=${{ secrets.VERCEL_TOKEN }}
          # kubectl rollout undo deployment/app -n production

      - name: Restore database backup
        run: |
          echo "Checking if database rollback is needed..."
          # Add database rollback logic if needed
          # psql ${{ secrets.PRODUCTION_DATABASE_URL }} < backup-latest.sql

      - name: Notify rollback
        run: |
          echo "Rollback completed. Notifying team..."
          # curl -X POST ${{ secrets.SLACK_WEBHOOK_URL }} \
          #   -H 'Content-Type: application/json' \
          #   -d '{"text":"🚨 Production deployment rolled back due to failures"}'
